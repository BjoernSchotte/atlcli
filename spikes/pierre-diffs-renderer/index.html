<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>atlcli · Pierre diff renderer spike</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: #f3f5f8;
        color: #172033;
      }
      * { box-sizing: border-box; }
      body { margin: 0; }
      main { width: min(1400px, 100%); margin: 0 auto; padding: 32px; }
      header { margin-bottom: 20px; }
      .eyebrow { color: #53627a; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
      h1 { font-size: 26px; margin: 6px 0; }
      #comparison { color: #53627a; margin: 0; }
      #summary { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0; }
      .metric { background: #fff; border: 1px solid #dce1e8; border-radius: 999px; padding: 7px 11px; font-size: 13px; }
      #diff-root { background: #fff; border: 1px solid #dce1e8; border-radius: 12px; box-shadow: 0 8px 24px rgb(25 39 65 / 8%); overflow: hidden; }
      #status { color: #53627a; padding: 24px; }
      .error { color: #a31515 !important; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div class="eyebrow">Experimental renderer · @pierre/diffs 1.3.5</div>
        <h1 id="title">Loading live review…</h1>
        <p id="comparison"></p>
      </header>
      <section id="summary" aria-label="Semantic change summary"></section>
      <section id="diff-root" aria-label="Rendered text diff">
        <p id="status">Loading exact-version diff…</p>
      </section>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
