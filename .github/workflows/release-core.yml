name: Core Packages Build & Test

# NOTE: npm registry publishing is deferred (spec 009 — package publishing).
# This workflow used to `npm publish` @atlcli/core/confluence/plugin-api using a
# long-lived NPM_TOKEN, bypassing every packaging quality gate. That publish path
# has been removed. What remains is a manual build+test sanity check for the core
# packages. No job here publishes to any registry.

on:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun --conditions=development test

      - name: Build packages
        run: bun run build
