name: Dev Release Cleanup

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Delete only the releases listed by the guarded retention plan
        required: false
        type: boolean
        default: false
      proven_tag:
        description: Required for apply; must equal the currently verified Homebrew dev release
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: dev-release
  cancel-in-progress: false

jobs:
  plan:
    name: Plan protected dev release retention
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.contract.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Resolve fixed stable and Homebrew protection pointers
        id: pointers
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROVEN_TAG: ${{ inputs.proven_tag }}
        run: |
          stable_latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          curl --fail --silent --show-error \
            https://raw.githubusercontent.com/BjoernSchotte/homebrew-tap/HEAD/metadata/atlcli-dev.json \
            --output homebrew-dev.json
          homebrew_tag="$(bun -e 'console.log((await Bun.file("homebrew-dev.json").json()).tag)')"
          if [ -n "$PROVEN_TAG" ]; then
            test "$PROVEN_TAG" = "$homebrew_tag"
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$PROVEN_TAG" > proven-release.json
            bun -e '
              const r = await Bun.file("proven-release.json").json();
              if (r.tag_name !== process.env.PROVEN_TAG || r.draft || !r.prerelease || !r.immutable) process.exit(1);
            '
          fi
          {
            echo "stable_latest=$stable_latest"
            echo "homebrew_tag=$homebrew_tag"
          } >> "$GITHUB_OUTPUT"

      - name: Read bounded public release inventory
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROVEN_TAG: ${{ inputs.proven_tag }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > releases.json
          count="$(bun -e 'console.log((await Bun.file("releases.json").json()).length)')"
          if [ "$count" -ge 100 ]; then
            echo "Release inventory reached bounded page size" >&2
            exit 1
          fi

      - name: Produce dry-run cleanup plan
        run: |
          bun scripts/ci/dev-release-retention.ts \
            --input releases.json \
            --stable-latest "${{ steps.pointers.outputs.stable_latest }}" \
            --homebrew-dev-tag "${{ steps.pointers.outputs.homebrew_tag }}" \
            --retain-successful 14 \
            --retain-days 30 \
            --out retention-plan.json

      - name: Freeze plan artifact name
        id: contract
        run: echo "artifact_name=dev-retention-plan-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"

      - name: Upload cleanup plan
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.contract.outputs.artifact_name }}
          path: |
            retention-plan.json
            homebrew-dev.json
            releases.json
          if-no-files-found: error
          retention-days: 90

  apply:
    name: Apply the exact reviewed cleanup plan
    needs: plan
    if: inputs.apply && inputs.proven_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Download this run's plan only
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.plan.outputs.artifact_name }}
          path: plan

      - name: Re-resolve protection pointers and require exact equality
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROVEN_TAG: ${{ inputs.proven_tag }}
        run: |
          stable_latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          curl --fail --silent --show-error \
            https://raw.githubusercontent.com/BjoernSchotte/homebrew-tap/HEAD/metadata/atlcli-dev.json \
            --output current-homebrew-dev.json
          homebrew_tag="$(bun -e 'console.log((await Bun.file("current-homebrew-dev.json").json()).tag)')"
          planned_stable="$(bun -e 'console.log((await Bun.file("plan/retention-plan.json").json()).protected.stableLatest)')"
          planned_homebrew="$(bun -e 'console.log((await Bun.file("plan/retention-plan.json").json()).protected.homebrewDev)')"
          test "$stable_latest" = "$planned_stable"
          test "$homebrew_tag" = "$planned_homebrew"
          test "$PROVEN_TAG" = "$homebrew_tag"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$PROVEN_TAG" > proven-release.json
          bun -e '
            const r = await Bun.file("proven-release.json").json();
            if (r.tag_name !== process.env.PROVEN_TAG || r.draft || !r.prerelease || !r.immutable) process.exit(1);
          '

      - name: Apply only the frozen protected plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bun scripts/ci/dev-release-retention.ts \
            --input plan/releases.json \
            --now "$(bun -e 'console.log((await Bun.file("plan/retention-plan.json").json()).generatedAt)' )" \
            --stable-latest "$(bun -e 'console.log((await Bun.file("plan/retention-plan.json").json()).protected.stableLatest)')" \
            --homebrew-dev-tag "$(bun -e 'console.log((await Bun.file("plan/retention-plan.json").json()).protected.homebrewDev)')" \
            --retain-successful 14 \
            --retain-days 30 \
            --expected-plan plan/retention-plan.json \
            --apply \
            --out applied-retention.json

      - name: Upload applied cleanup receipt
        uses: actions/upload-artifact@v7
        with:
          name: dev-retention-applied-${{ github.run_id }}-${{ github.run_attempt }}
          path: applied-retention.json
          if-no-files-found: error
          retention-days: 90
