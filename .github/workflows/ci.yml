name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Full unfiltered drift guard. Path routing must never become the only proof.
    - cron: "33 5 * * 6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Classify changed surfaces
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.routes.outputs.code }}
      consumer: ${{ steps.routes.outputs.consumer }}
      docs: ${{ steps.routes.outputs.docs }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Determine required gates
        id: routes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          FULL_RUN: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: |
          if [[ "$FULL_RUN" == "true" ]]; then
            bun scripts/ci/classify-changes.ts --full >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -z "$BASE_SHA" || -z "$HEAD_SHA" || "$BASE_SHA" =~ ^0+$ ]] || \
             ! git cat-file -e "$BASE_SHA^{commit}" || ! git cat-file -e "$HEAD_SHA^{commit}"; then
            echo "::warning::Unable to resolve comparison range; running every gate"
            bun scripts/ci/classify-changes.ts --full >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --check "$BASE_SHA" "$HEAD_SHA"
          git diff --name-only -z "$BASE_SHA" "$HEAD_SHA" | \
            bun scripts/ci/classify-changes.ts --null >> "$GITHUB_OUTPUT"

  docs:
    name: Documentation
    needs: changes
    if: needs.changes.outputs.docs == 'true' && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22.12.0"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check docs
        run: bun run docs:check

      - name: Build docs
        run: bun run docs:build

  test:
    name: Product quality
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/reusable-quality.yml

  consumer-smoke:
    name: Pinned consumer smoke
    needs: changes
    if: needs.changes.outputs.consumer == 'true'
    uses: ./.github/workflows/reusable-consumer-smoke.yml
    with:
      leg: pinned

  # Platform gates stay complete for every product change. Path-level pruning
  # can be added later only after the dependency closures are machine-derived.
  pdf-cli-macos:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Provision pinned PDF fonts
        run: bun run fonts:ensure

      - name: PDF compile-port and build-mode tests
        run: bun --conditions=development test apps/cli/src/commands/export-pdf-assets.test.ts apps/cli/src/commands/export-pdf-build-modes.test.ts apps/cli/src/commands/export-pdf-integration.test.ts

      - name: Diagram/SVG rasterizer build-mode tests
        run: bun --conditions=development test apps/cli/src/commands/export-rasterizer-build-modes.test.ts

  pdf-sink-windows:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Restore Bun package cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Sink commit-protocol tests
        run: bun --conditions=development test apps/cli/src/commands/export-pdf-sink.test.ts

  test-python:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        working-directory: packages/export
        run: uv sync

      - name: Run Python tests
        working-directory: packages/export
        run: uv run pytest tests/ -v

  browser-export-harness:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Restore Bun package cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-browser-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-browser-
            ${{ runner.os }}-turbo-

      - name: Restore Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-1.55.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Provision pinned PDF fonts
        run: bun run fonts:ensure

      - name: Install Playwright Chromium
        run: bunx playwright@1.55.0 install --with-deps chromium

      - name: Type check browser export harness
        run: bun run typecheck:browser-export-harness

      - name: Build browser export harness
        run: bun run build:browser-export-harness

      - name: Check browser export harness artifact
        run: bun run check:browser-export-harness

      - name: Assert conformance-case registry
        run: bun run assert:conformance-cases

      - name: Run browser export harness E2E
        run: bun run test:browser-export-harness

      - name: Verify PDF.js worker in the built MV3 extension
        run: bun run --cwd apps/extension test:worker-extension-browser

      - name: Shape-parity gate
        run: bun run check:parity

  required:
    name: required
    if: always()
    needs:
      - changes
      - docs
      - test
      - consumer-smoke
      - pdf-cli-macos
      - pdf-sink-windows
      - test-python
      - browser-export-harness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every selected gate to pass
        env:
          CHANGES: ${{ needs.changes.result }}
          DOCS: ${{ needs.docs.result }}
          TEST: ${{ needs.test.result }}
          CONSUMER: ${{ needs.consumer-smoke.result }}
          MACOS: ${{ needs.pdf-cli-macos.result }}
          WINDOWS: ${{ needs.pdf-sink-windows.result }}
          PYTHON: ${{ needs.test-python.result }}
          BROWSER: ${{ needs.browser-export-harness.result }}
        run: |
          for result in "$CHANGES" "$DOCS" "$TEST" "$CONSUMER" "$MACOS" "$WINDOWS" "$PYTHON" "$BROWSER"; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "::error::A selected CI gate finished with result: $result"
              exit 1
            fi
          done
