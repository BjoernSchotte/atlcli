name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # Spelled out rather than inherited from the GitHub default. Without
    # `ready_for_review` a PR can sit in draft for days and then be marked
    # ready — the moment a human is asked to trust the checks — while the
    # newest run still points at an outdated moment in time. Every
    # `pull_request`-triggered workflow in this repo carries this same list;
    # scripts/ci/workflow-policy.test.ts enforces it.
    types: [opened, synchronize, reopened, ready_for_review]
  # Inactive until a repository merge queue is enabled. Keeping the trigger on
  # the default branch first prevents a future queue from waiting forever for
  # a required context that no workflow can create.
  merge_group:
    types: [checks_requested]
  schedule:
    # Full unfiltered drift guard. Path routing must never become the only proof.
    - cron: "33 5 * * 6"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Classify changed surfaces
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.routes.outputs.code }}
      consumer: ${{ steps.routes.outputs.consumer }}
      docs: ${{ steps.routes.outputs.docs }}
      readmeMedia: ${{ steps.routes.outputs.readmeMedia }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Determine required gates
        id: routes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          FULL_RUN: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group' }}
        run: |
          if [[ "${{ github.event_name }}" == "merge_group" ]] && \
             { [[ -z "$MERGE_GROUP_BASE_SHA" ]] || [[ -z "$MERGE_GROUP_HEAD_SHA" ]]; }; then
            echo "::warning::Merge-group comparison SHA is incomplete; running every gate"
            bun scripts/ci/classify-changes.ts --full >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$FULL_RUN" == "true" ]]; then
            bun scripts/ci/classify-changes.ts --full >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -z "$BASE_SHA" || -z "$HEAD_SHA" || "$BASE_SHA" =~ ^0+$ ]] || \
             ! git cat-file -e "$BASE_SHA^{commit}" || ! git cat-file -e "$HEAD_SHA^{commit}"; then
            echo "::warning::Unable to resolve comparison range; running every gate"
            bun scripts/ci/classify-changes.ts --full >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --check "$BASE_SHA" "$HEAD_SHA"
          git diff --name-only -z "$BASE_SHA" "$HEAD_SHA" | \
            bun scripts/ci/classify-changes.ts --null >> "$GITHUB_OUTPUT"

  research-privacy:
    name: Tracked research privacy
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Scan tracked research data
        run: bun run check:research-privacy

  docs:
    name: Documentation
    needs: changes
    if: needs.changes.outputs.docs == 'true' && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22.12.0"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check docs
        run: bun run docs:check

      - name: Build docs
        run: bun run docs:build

  readme-media:
    name: README media
    needs: changes
    if: needs.changes.outputs.readmeMedia == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Validate README media
        run: bun run check:readme-media

  test:
    name: Product quality
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/reusable-quality.yml

  consumer-smoke:
    name: Pinned consumer smoke
    needs: changes
    if: needs.changes.outputs.consumer == 'true'
    uses: ./.github/workflows/reusable-consumer-smoke.yml
    with:
      leg: pinned

  # Platform gates stay complete for every product change. Path-level pruning
  # can be added later only after the dependency closures are machine-derived.
  pdf-cli-macos:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Provision pinned PDF fonts
        run: bun run fonts:ensure

      - name: PDF compile-port and build-mode tests
        run: bun --conditions=development test apps/cli/src/commands/export-pdf-assets.test.ts apps/cli/src/commands/export-pdf-build-modes.test.ts apps/cli/src/commands/export-pdf-integration.test.ts

      - name: Diagram/SVG rasterizer build-mode tests
        run: bun --conditions=development test apps/cli/src/commands/export-rasterizer-build-modes.test.ts

  pdf-sink-windows:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Restore Bun package cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Sink commit-protocol tests
        run: bun --conditions=development test apps/cli/src/commands/export-pdf-sink.test.ts

  browser-export-harness:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Restore Bun package cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-browser-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-browser-
            ${{ runner.os }}-turbo-

      - name: Restore Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-1.55.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Provision pinned PDF fonts
        run: bun run fonts:ensure

      - name: Install Playwright Chromium
        run: bunx playwright@1.55.0 install --with-deps chromium

      - name: Type check browser export harness
        run: bun run typecheck:browser-export-harness

      - name: Build browser export harness
        run: bun run build:browser-export-harness

      - name: Check browser export harness artifact
        run: bun run check:browser-export-harness

      - name: Assert conformance-case registry
        run: bun run assert:conformance-cases

      - name: Run browser export harness E2E
        run: bun run test:browser-export-harness

      - name: Build packed MV3 extension once
        run: bun run --cwd apps/extension build

      - name: Verify PDF.js worker in the built MV3 extension
        run: bun run --cwd apps/extension test:worker-extension-browser:prebuilt

      - name: Verify durable export jobs in the built MV3 extension
        run: bun run --cwd apps/extension test:jobs-extension-browser:prebuilt

      - name: Verify Rovo visibility in the built MV3 extension
        run: bun run --cwd apps/extension test:rovo-extension-browser:prebuilt

      - name: Shape-parity gate
        run: bun run check:parity

  # Compatibility signal only. GitHub runner Chrome is intentionally not a
  # substitute for Playwright-matched Chromium in the required MV3 proof.
  browser-system-chrome-canary:
    name: Non-required system Chrome compatibility
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Restore Bun package cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Provision pinned PDF fonts
        run: bun run fonts:ensure

      - name: Record browser compatibility surface
        run: |
          {
            echo "## System Chrome compatibility canary"
            echo
            echo "- Runner image: \`${ImageOS:-unknown} ${ImageVersion:-unknown}\`"
            echo "- System browser: \`$(google-chrome --version)\`"
            echo "- Playwright: \`$(bunx playwright --version)\`"
            echo "- Channel: \`chrome\` (non-required)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Type check browser export harness
        run: bun run typecheck:browser-export-harness

      - name: Build browser export harness
        run: bun run build:browser-export-harness

      - name: Check browser export harness artifact
        run: bun run check:browser-export-harness

      - name: Assert conformance-case registry
        run: bun run assert:conformance-cases

      - name: Run neutral harness on system Chrome
        env:
          ATLCLI_PLAYWRIGHT_CHANNEL: chrome
        run: bun run test:browser-export-harness

  required:
    name: required
    if: always()
    needs:
      - changes
      - docs
      - readme-media
      - test
      - consumer-smoke
      - pdf-cli-macos
      - pdf-sink-windows
      - browser-export-harness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every selected gate to pass
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE_REQUIRED: ${{ needs.changes.outputs.code }}
          CONSUMER_REQUIRED: ${{ needs.changes.outputs.consumer }}
          DOCS_REQUIRED: ${{ needs.changes.outputs.docs }}
          README_MEDIA_REQUIRED: ${{ needs.changes.outputs.readmeMedia }}
          EVENT_NAME: ${{ github.event_name }}
          DOCS: ${{ needs.docs.result }}
          README_MEDIA: ${{ needs.readme-media.result }}
          TEST: ${{ needs.test.result }}
          CONSUMER: ${{ needs.consumer-smoke.result }}
          MACOS: ${{ needs.pdf-cli-macos.result }}
          WINDOWS: ${{ needs.pdf-sink-windows.result }}
          BROWSER: ${{ needs.browser-export-harness.result }}
        run: |
          require_result() {
            local gate="$1"
            local selected="$2"
            local result="$3"
            local expected="skipped"
            if [[ "$selected" == "true" ]]; then
              expected="success"
            fi
            if [[ "$result" != "$expected" ]]; then
              echo "::error::$gate was selected=$selected and finished with result=$result; expected $expected"
              exit 1
            fi
          }

          if [[ "$CHANGES" != "success" ]]; then
            echo "::error::Change classification finished with result: $CHANGES"
            exit 1
          fi

          DOCS_SELECTED="$DOCS_REQUIRED"
          if [[ "$EVENT_NAME" == "push" ]]; then
            # docs.yml owns main-push deployment; CI's docs job intentionally
            # runs only for PR, schedule, and manual events.
            DOCS_SELECTED="false"
          fi

          require_result "Documentation" "$DOCS_SELECTED" "$DOCS"
          require_result "README media" "$README_MEDIA_REQUIRED" "$README_MEDIA"
          require_result "Product quality" "$CODE_REQUIRED" "$TEST"
          require_result "Pinned consumer smoke" "$CONSUMER_REQUIRED" "$CONSUMER"
          require_result "macOS PDF" "$CODE_REQUIRED" "$MACOS"
          require_result "Windows PDF sink" "$CODE_REQUIRED" "$WINDOWS"
          require_result "Browser export harness" "$CODE_REQUIRED" "$BROWSER"

  # Measurement is deliberately downstream from, and non-blocking for, the
  # stable required check. A telemetry failure stays visible without delaying
  # or satisfying merge proof.
  telemetry:
    name: Non-required CI timing telemetry
    if: always() && needs.changes.result == 'success'
    needs: [changes, required]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Prepare telemetry input
        run: mkdir -p test-results

      - name: Download same-run JUnit artifacts
        if: needs.changes.outputs.code == 'true'
        uses: actions/download-artifact@v5
        with:
          pattern: bun-test-shard-*-${{ github.sha }}
          path: test-results

      - name: Read same-attempt Actions jobs
        uses: actions/github-script@v8
        with:
          script: |
            const jobs = await github.paginate(
              "GET /repos/{owner}/{repo}/actions/runs/{run_id}/attempts/{attempt_number}/jobs",
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId,
                attempt_number: Number(process.env.GITHUB_RUN_ATTEMPT),
                per_page: 100,
              },
            );
            require("node:fs").writeFileSync(
              "actions-jobs.json",
              JSON.stringify({ jobs }, null, 2),
            );

      - name: Summarize timing evidence
        env:
          CI_TEST_TOPOLOGY: legacy-4-shard
          CI_ROUTE_CODE: ${{ needs.changes.outputs.code }}
          CI_ROUTE_CONSUMER: ${{ needs.changes.outputs.consumer }}
          CI_ROUTE_DOCS: ${{ needs.changes.outputs.docs }}
          CI_ROUTE_README_MEDIA: ${{ needs.changes.outputs.readmeMedia }}
        run: |
          bun scripts/ci/telemetry-summary.ts \
            --junit test-results \
            --jobs actions-jobs.json \
            --out ci-timing.json

      - name: Upload timing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-timing-${{ github.run_attempt }}-${{ github.sha }}
          path: ci-timing.json
          if-no-files-found: warn
