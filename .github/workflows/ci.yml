name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.5'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check docs
        run: bun run docs:check

      - name: Build docs
        run: bun run docs:build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: bun install

      - name: Type check
        run: bun run typecheck

      - name: Type check extension
        run: bun run typecheck:extension

      - name: Check browser build
        run: bun run check:browser

      - name: Run tests
        run: |
          # Bun 1.3.5 can exit with code 1 on Linux even when every test passes.
          # Preserve genuine failures while accepting an exact zero-failure summary.
          set +e
          bun test 2>&1 | tee "$RUNNER_TEMP/bun-test.log"
          TEST_EXIT=${PIPESTATUS[0]}
          set -e

          if [ "$TEST_EXIT" -eq 0 ]; then
            exit 0
          fi

          if grep -Eq '^[[:space:]]*[1-9][0-9]* errors?[[:space:]]*$' "$RUNNER_TEMP/bun-test.log"; then
            exit "$TEST_EXIT"
          fi

          if grep -Eq '^[[:space:]]*0 fail[[:space:]]*$' "$RUNNER_TEMP/bun-test.log"; then
            echo "::warning::Bun exited with code $TEST_EXIT despite reporting zero failed tests"
            exit 0
          fi

          exit "$TEST_EXIT"

      - name: Build
        run: bun run build

      - name: Check extension output bundle
        run: bun run check:extension-output

  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        working-directory: packages/export
        run: uv sync

      - name: Run Python tests
        working-directory: packages/export
        run: uv run pytest tests/ -v
