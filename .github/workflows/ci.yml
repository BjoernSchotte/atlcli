name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check docs
        run: bun run docs:check

      - name: Build docs
        run: bun run docs:build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: bun install

      - name: Type check
        run: bun run typecheck

      - name: Type check extension
        run: bun run typecheck:extension

      - name: Check browser build
        run: bun run check:browser

      - name: Run tests
        run: |
          # Bun has been seen exiting with code 1 on Linux even when every test
          # passes (first observed on 1.3.5, kept as a belt-and-braces guard).
          # Preserve genuine failures while accepting an exact zero-failure summary.
          set +e
          bun --conditions=development test 2>&1 | tee "$RUNNER_TEMP/bun-test.log"
          TEST_EXIT=${PIPESTATUS[0]}
          set -e

          if [ "$TEST_EXIT" -eq 0 ]; then
            exit 0
          fi

          if grep -Eq '^[[:space:]]*[1-9][0-9]* errors?[[:space:]]*$' "$RUNNER_TEMP/bun-test.log"; then
            exit "$TEST_EXIT"
          fi

          if grep -Eq '^[[:space:]]*0 fail[[:space:]]*$' "$RUNNER_TEMP/bun-test.log"; then
            echo "::warning::Bun exited with code $TEST_EXIT despite reporting zero failed tests"
            exit 0
          fi

          exit "$TEST_EXIT"

      - name: Build
        run: bun run build

      - name: Check extension output bundle
        run: bun run check:extension-output

  # Spec 008 T3.1 platform gate: the three-run-mode wasm compile check (source,
  # dist bundle, compiled binary) must hold on macOS as well as Linux — the
  # release ships binaries for both. Scoped to the PDF compile-port tests to
  # keep the matrix cost sane; the full suite runs on ubuntu above.
  pdf-cli-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Provision pinned PDF fonts
        run: bun run fonts:ensure

      - name: PDF compile-port and build-mode tests
        run: bun --conditions=development test apps/cli/src/commands/export-pdf-assets.test.ts apps/cli/src/commands/export-pdf-build-modes.test.ts apps/cli/src/commands/export-pdf-integration.test.ts

      # Spec 006 G4: the diagram/SVG rasterizer's resvg-wasm + font imports must
      # resolve in every build mode on macOS too (the release ships macOS
      # binaries, and SVG attachment embedding depends on this rasterizer).
      - name: Diagram/SVG rasterizer build-mode tests
        run: bun --conditions=development test apps/cli/src/commands/export-rasterizer-build-modes.test.ts

  # Spec 008 T3.2 platform gate: the filePdfOutputSink commit protocol
  # (exclusive temp, symlink refusal, atomic no-replace commit, containment)
  # must hold on Windows too — release.yml ships a Windows binary. Scoped to
  # the sink tests; the full suite runs on ubuntu above.
  pdf-sink-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Sink commit-protocol tests
        run: bun --conditions=development test apps/cli/src/commands/export-pdf-sink.test.ts

  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        working-directory: packages/export
        run: uv sync

      - name: Run Python tests
        working-directory: packages/export
        run: uv run pytest tests/ -v

  browser-export-harness:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Provision pinned PDF fonts
        run: bun run fonts:ensure

      - name: Install Playwright Chromium
        run: bunx playwright@1.55.0 install --with-deps chromium

      - name: Type check browser export harness
        run: bun run typecheck:browser-export-harness

      - name: Build browser export harness
        run: bun run build:browser-export-harness

      - name: Check browser export harness artifact
        run: bun run check:browser-export-harness

      - name: Assert conformance-case registry (spec 011 T4.6 drift guard)
        run: bun run assert:conformance-cases

      - name: Run browser export harness E2E
        run: bun run test:browser-export-harness

      - name: Shape-parity gate (harness vs CLI digests + report projection)
        run: bun run check:parity
