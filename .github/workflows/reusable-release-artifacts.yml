name: Reusable Release Artifacts

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      source_ref:
        required: true
        type: string
      channel:
        required: true
        type: string
      version:
        required: true
        type: string
      build_id:
        required: true
        type: string
      created_at:
        required: true
        type: string
      release_attempt:
        required: true
        type: number
      security_attestation_artifact:
        required: true
        type: string
      source_eligibility_artifact:
        required: false
        type: string
        default: ""
    outputs:
      bundle_artifact:
        description: Run-unique artifact containing the exact manifested release asset set
        value: ${{ jobs.bundle.outputs.bundle_artifact }}

env:
  BUN_VERSION: "1.3.14"

permissions:
  contents: read

jobs:
  build-cli:
    name: Build CLI (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [linux-x64, linux-arm64, darwin-x64, darwin-arm64, windows-x64]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0

      - name: Assert exact source checkout
        run: test "$(git rev-parse HEAD)" = "${{ inputs.source_sha }}"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore pinned PDF fonts
        uses: actions/cache@v6
        with:
          path: packages/pdf/.fonts
          key: ${{ runner.os }}-pdf-fonts-v1-${{ hashFiles('packages/pdf/src/runtime-assets.ts', 'packages/pdf/scripts/ensure-fonts.ts') }}

      - name: Install frozen dependencies
        run: bash scripts/ci/install-frozen-dependencies.sh

      - name: Provision pinned PDF fonts
        run: bun run fonts:ensure

      - name: Build one deterministic CLI archive
        run: |
          bun scripts/release-artifacts.ts build \
            --channel "${{ inputs.channel }}" \
            --version "${{ inputs.version }}" \
            --source-sha "${{ inputs.source_sha }}" \
            --timestamp "${{ inputs.created_at }}" \
            --run-number "$GITHUB_RUN_NUMBER" \
            --run-attempt "${{ inputs.release_attempt }}" \
            --target "${{ matrix.target }}" \
            --skip-extension \
            --output release \
            --receipt build-receipt.json

      - name: Assert requested build identity
        env:
          EXPECTED_BUILD_ID: ${{ inputs.build_id }}
        run: |
          bun -e '
            const receipt = await Bun.file("build-receipt.json").json();
            if (receipt.identity.buildId !== process.env.EXPECTED_BUILD_ID) process.exit(1);
          '

      - name: Upload SHA-bound CLI artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ inputs.channel }}-${{ inputs.source_sha }}-${{ github.run_id }}-${{ inputs.release_attempt }}-cli-${{ matrix.target }}
          path: release/atlcli-${{ matrix.target }}.*
          if-no-files-found: error
          retention-days: 7

  build-extension:
    name: Build Chrome MV3 extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0

      - name: Assert exact source checkout
        run: test "$(git rev-parse HEAD)" = "${{ inputs.source_sha }}"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore pinned PDF fonts
        uses: actions/cache@v6
        with:
          path: packages/pdf/.fonts
          key: ${{ runner.os }}-pdf-fonts-v1-${{ hashFiles('packages/pdf/src/runtime-assets.ts', 'packages/pdf/scripts/ensure-fonts.ts') }}

      - name: Install frozen dependencies
        run: bash scripts/ci/install-frozen-dependencies.sh

      - name: Provision pinned PDF fonts
        run: bun run fonts:ensure

      - name: Build deterministic extension archive
        run: |
          bun scripts/release-artifacts.ts build \
            --channel "${{ inputs.channel }}" \
            --version "${{ inputs.version }}" \
            --source-sha "${{ inputs.source_sha }}" \
            --timestamp "${{ inputs.created_at }}" \
            --run-number "$GITHUB_RUN_NUMBER" \
            --run-attempt "${{ inputs.release_attempt }}" \
            --skip-cli \
            --output release \
            --receipt build-receipt.json

      - name: Assert requested build identity
        env:
          EXPECTED_BUILD_ID: ${{ inputs.build_id }}
        run: |
          bun -e '
            const receipt = await Bun.file("build-receipt.json").json();
            if (receipt.identity.buildId !== process.env.EXPECTED_BUILD_ID) process.exit(1);
          '

      - name: Upload SHA-bound extension artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ inputs.channel }}-${{ inputs.source_sha }}-${{ github.run_id }}-${{ inputs.release_attempt }}-extension
          path: release/atlcli-extension-chrome-mv3-${{ inputs.build_id }}.zip
          if-no-files-found: error
          retention-days: 7

  bundle:
    name: Assemble and consume exact release bundle
    needs: [build-cli, build-extension]
    runs-on: ubuntu-latest
    outputs:
      bundle_artifact: ${{ steps.contract.outputs.name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install frozen dependencies
        run: bash scripts/ci/install-frozen-dependencies.sh

      - name: Download this run's CLI artifacts only
        uses: actions/download-artifact@v8
        with:
          pattern: release-${{ inputs.channel }}-${{ inputs.source_sha }}-${{ github.run_id }}-${{ inputs.release_attempt }}-cli-*
          path: bundle
          merge-multiple: true

      - name: Download this run's extension artifact only
        uses: actions/download-artifact@v8
        with:
          name: release-${{ inputs.channel }}-${{ inputs.source_sha }}-${{ github.run_id }}-${{ inputs.release_attempt }}-extension
          path: bundle

      - name: Download exact-SHA security attestation
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.security_attestation_artifact }}
          path: bundle

      - name: Download eligible-source receipt
        if: inputs.source_eligibility_artifact != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.source_eligibility_artifact }}
          path: bundle

      - name: Assemble checksums and revision-bound metadata
        run: |
          args=(
            --dir bundle
            --channel "${{ inputs.channel }}"
            --version "${{ inputs.version }}"
            --source-sha "${{ inputs.source_sha }}"
            --source-ref "${{ inputs.source_ref }}"
            --created-at "${{ inputs.created_at }}"
            --run-id "$GITHUB_RUN_ID"
            --run-number "$GITHUB_RUN_NUMBER"
            --run-attempt "${{ inputs.release_attempt }}"
            --event "$GITHUB_EVENT_NAME"
            --build-id "${{ inputs.build_id }}"
            --security-attestation bundle/security-attestation.json
            --runner-os "$RUNNER_OS-$RUNNER_ARCH"
          )
          if [ -f bundle/source-eligibility.json ]; then
            args+=(--source-eligibility bundle/source-eligibility.json)
          fi
          bun scripts/assemble-release-bundle.ts "${args[@]}" > "$RUNNER_TEMP/release-bundle-assembly.json"

      - name: Verify the exact assembled bundle
        run: bun scripts/verify-release-artifacts.ts --dir bundle > "$RUNNER_TEMP/release-verification.json"

      - name: Install Chromium for packed consumer proof
        run: bunx playwright install --with-deps chromium

      - name: Run packed extension release smoke against bundle bytes
        env:
          ATLCLI_EXTENSION_OUTPUT_DIR: ${{ github.workspace }}/bundle/extension
        run: |
          bun run --cwd apps/extension test:worker-extension-browser:prebuilt

      - name: Remove owned consumer extraction from release bundle
        run: bun scripts/verify-release-artifacts.ts cleanup-extension --out bundle/extension

      - name: Freeze run-unique bundle artifact name
        id: contract
        run: echo "name=release-bundle-${{ inputs.channel }}-${{ inputs.source_sha }}-${{ github.run_id }}-${{ inputs.release_attempt }}" >> "$GITHUB_OUTPUT"

      - name: Upload exact release bundle
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.contract.outputs.name }}
          path: |
            bundle/atlcli-*.tar.gz
            bundle/atlcli-windows-x64.zip
            bundle/atlcli-extension-chrome-mv3-${{ inputs.build_id }}.zip
            bundle/checksums.txt
            bundle/build-metadata.json
            bundle/security-attestation.json
            bundle/source-eligibility.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload consumer verification receipts
        uses: actions/upload-artifact@v7
        with:
          name: release-verification-${{ inputs.channel }}-${{ inputs.source_sha }}-${{ github.run_id }}-${{ inputs.release_attempt }}
          path: |
            ${{ runner.temp }}/release-bundle-assembly.json
            ${{ runner.temp }}/release-verification.json
          if-no-files-found: error
          retention-days: 30
