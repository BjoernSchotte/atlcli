name: Dev Release

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      source_sha:
        description: Optional full SHA reachable from origin/main; empty resolves current origin/main
        required: false
        type: string
        default: ""
      force_rebuild:
        description: Build a new immutable tag even when this SHA already has a proven dev release
        required: false
        type: boolean
        default: false
      publish_homebrew:
        description: Publish atlcli-dev after GitHub release verification (wired in DR-07)
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: dev-release
  cancel-in-progress: false

jobs:
  resolve-source:
    name: Resolve immutable source from origin/main
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.identity.outputs.source_sha }}
      source_ref: ${{ steps.identity.outputs.source_ref }}
      version: ${{ steps.identity.outputs.version }}
      build_id: ${{ steps.identity.outputs.build_id }}
      created_at: ${{ steps.identity.outputs.created_at }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Validate source against origin/main and freeze identity
        id: identity
        env:
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha || '' }}
        run: |
          git fetch --no-tags origin main
          main_sha="$(git rev-parse origin/main)"
          source_sha="$REQUESTED_SOURCE_SHA"
          if [ -z "$source_sha" ]; then
            source_sha="$main_sha"
          fi
          if ! [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_sha must be a lowercase full Git SHA" >&2
            exit 1
          fi
          git cat-file -e "$source_sha^{commit}"
          git merge-base --is-ancestor "$source_sha" origin/main
          git checkout --detach "$source_sha"
          test "$(git rev-parse HEAD)" = "$source_sha"

          version="$(node -p 'require("./package.json").version')"
          created_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          bun scripts/release-artifacts.ts identity \
            --channel dev \
            --version "$version" \
            --source-sha "$source_sha" \
            --timestamp "$created_at" \
            --run-number "$GITHUB_RUN_NUMBER" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" > dev-release-identity.json
          build_id="$(bun -e 'console.log((await Bun.file("dev-release-identity.json").json()).buildId)')"
          {
            echo "source_sha=$source_sha"
            echo "source_ref=refs/heads/main"
            echo "version=$version"
            echo "build_id=$build_id"
            echo "created_at=$created_at"
          } >> "$GITHUB_OUTPUT"

      - name: Upload source identity receipt
        uses: actions/upload-artifact@v7
        with:
          name: dev-source-identity-${{ steps.identity.outputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dev-release-identity.json
          if-no-files-found: error
          retention-days: 30

  publication-decision:
    name: Enforce immutable no-op or new-build decision
    needs: resolve-source
    runs-on: ubuntu-latest
    outputs:
      decision: ${{ steps.decision.outputs.decision }}
      selected_tag: ${{ steps.decision.outputs.selected_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-source.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Inspect existing immutable dev releases
        id: decision
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bun scripts/ci/dev-release-decision.ts \
            --version "${{ needs.resolve-source.outputs.version }}" \
            --source-sha "${{ needs.resolve-source.outputs.source_sha }}" \
            --created-at "${{ needs.resolve-source.outputs.created_at }}" \
            --run-number "$GITHUB_RUN_NUMBER" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --force-rebuild "${{ inputs.force_rebuild || false }}" \
            --out dev-publication-decision.json

      - name: Upload publication decision receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dev-publication-decision-${{ needs.resolve-source.outputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dev-publication-decision.json
          if-no-files-found: error
          retention-days: 30

  no-op:
    name: Existing SHA already proven
    needs: [resolve-source, publication-decision]
    if: needs.publication-decision.outputs.decision == 'noop'
    runs-on: ubuntu-latest
    steps:
      - name: Record immutable no-op
        run: echo "Source ${{ needs.resolve-source.outputs.source_sha }} is already proven by ${{ needs.publication-decision.outputs.selected_tag }}"

  eligible-source:
    name: Exact SHA has green canonical main CI
    needs: [resolve-source, publication-decision]
    if: needs.publication-decision.outputs.decision == 'create'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      checks: read
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-source.outputs.source_sha }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Require successful canonical main-push CI for exact SHA
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bun scripts/ci/release-eligibility.ts \
            --source-sha "${{ needs.resolve-source.outputs.source_sha }}" \
            --timeout-seconds 900 \
            --poll-seconds 15 \
            --out source-eligibility.json

      - name: Upload source eligibility receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: source-eligibility-${{ needs.resolve-source.outputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: source-eligibility.json
          if-no-files-found: error
          retention-days: 30

  preflight:
    name: SHA-bound current release preflight
    needs: [resolve-source, publication-decision, eligible-source]
    if: needs.publication-decision.outputs.decision == 'create'
    uses: ./.github/workflows/reusable-quality.yml
    with:
      source_sha: ${{ needs.resolve-source.outputs.source_sha }}
      emit_security_attestation: true

  artifacts:
    name: Build and consume SHA-bound dev artifacts
    needs: [resolve-source, publication-decision, eligible-source, preflight]
    if: needs.publication-decision.outputs.decision == 'create'
    uses: ./.github/workflows/reusable-release-artifacts.yml
    with:
      source_sha: ${{ needs.resolve-source.outputs.source_sha }}
      source_ref: ${{ needs.resolve-source.outputs.source_ref }}
      channel: dev
      version: ${{ needs.resolve-source.outputs.version }}
      build_id: ${{ needs.resolve-source.outputs.build_id }}
      created_at: ${{ needs.resolve-source.outputs.created_at }}
      security_attestation_artifact: security-attestation-${{ needs.resolve-source.outputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      source_eligibility_artifact: source-eligibility-${{ needs.resolve-source.outputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}

  proven-build:
    name: Dev artifact graph proven without publication
    needs: [resolve-source, publication-decision, eligible-source, preflight, artifacts]
    if: needs.publication-decision.outputs.decision == 'create'
    runs-on: ubuntu-latest
    steps:
      - name: Record DR-05 boundary
        env:
          PUBLISH_HOMEBREW_REQUESTED: ${{ github.event_name == 'schedule' || inputs.publish_homebrew }}
        run: |
          echo "Built and consumer-tested ${{ needs.resolve-source.outputs.build_id }}"
          echo "DR-05 intentionally has no GitHub or Homebrew write permission."
          echo "publish_homebrew=$PUBLISH_HOMEBREW_REQUESTED is consumed only after DR-07."
