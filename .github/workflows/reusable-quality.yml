name: Reusable product quality

on:
  workflow_call:
    inputs:
      emit_security_attestation:
        description: Emit and upload a security attestation for this exact SHA
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  static-quality:
    name: Linux typecheck, browser checks, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Restore Bun package cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-quality-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-quality-
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check pinned ADF contract offline
        run: bun run check:adf-pinned

      - name: Check generated Shiki catalogues and loaders
        run: bun run --cwd packages/code-highlight catalogue:check

      - name: Type check
        run: bun run typecheck

      - name: Check browser build
        run: bun run check:browser

      - name: Build
        run: bun run build

      - name: Check extension output bundle
        run: bun run check:extension-output

  tests:
    name: Linux Bun tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Restore Bun package cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install PDF proof tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes poppler-utils
          pdftoppm -v
          pdftotext -v

      # Tests resolve the gitignored, sha-pinned font tree directly. The old
      # serial quality job warmed it during typecheck; independent shards must
      # establish the same precondition themselves.
      - name: Provision pinned PDF fonts
        run: bun run fonts:ensure

      - name: Run test shard
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          mkdir -p test-results
          LOG_FILE="test-results/bun-test-shard-${SHARD}.log"
          JUNIT_FILE="test-results/bun-test-shard-${SHARD}.xml"

          # Invoke the root test contract so the development export condition
          # cannot drift. Bun has also been seen exiting with code 1 on Linux
          # despite reporting zero failures; preserve genuine failures while
          # accepting only that exact zero-failure summary.
          set +e
          bun run test --shard="${SHARD}/4" \
            --reporter=junit \
            --reporter-outfile="$JUNIT_FILE" \
            2>&1 | tee "$LOG_FILE"
          TEST_EXIT=${PIPESTATUS[0]}
          set -e

          if [ "$TEST_EXIT" -eq 0 ]; then
            exit 0
          fi

          if grep -Eq '^[[:space:]]*[1-9][0-9]* errors?[[:space:]]*$' "$LOG_FILE"; then
            exit "$TEST_EXIT"
          fi

          if grep -Eq '^[[:space:]]*0 fail[[:space:]]*$' "$LOG_FILE"; then
            echo "::warning::Bun shard ${SHARD}/4 exited with code $TEST_EXIT despite reporting zero failed tests"
            exit 0
          fi

          exit "$TEST_EXIT"

      - name: Upload test shard JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bun-test-shard-${{ matrix.shard }}-${{ github.sha }}
          path: test-results/bun-test-shard-${{ matrix.shard }}.xml
          if-no-files-found: error

      - name: Upload failed test shard log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bun-test-shard-${{ matrix.shard }}-failure-log-${{ github.sha }}
          path: test-results/bun-test-shard-${{ matrix.shard }}.log
          if-no-files-found: error

  security-attestation:
    name: Exact-SHA security attestation
    needs: [static-quality, tests]
    if: inputs.emit_security_attestation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          # attest.ts compares HEAD with its parent. Keep the exact release SHA
          # plus one parent so the delta cannot silently become indeterminate.
          fetch-depth: 2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Emit security attestation
        run: bun scripts/security/attest.ts --out security-attestation.json

      - name: Verify security attestation SHA
        run: |
          bun -e '
            const attestation = await Bun.file("security-attestation.json").json();
            if (attestation.commit !== process.env.GITHUB_SHA) {
              console.error(`Attestation commit ${attestation.commit} does not match ${process.env.GITHUB_SHA}`);
              process.exit(1);
            }
          '

      - name: Upload security attestation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-attestation-${{ github.sha }}
          path: security-attestation.json
          if-no-files-found: error

  quality-complete:
    name: Linux quality complete
    if: always()
    needs: [static-quality, tests, security-attestation]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every quality gate to pass
        env:
          STATIC_QUALITY: ${{ needs.static-quality.result }}
          TESTS: ${{ needs.tests.result }}
          ATTESTATION: ${{ needs.security-attestation.result }}
          ATTESTATION_REQUIRED: ${{ inputs.emit_security_attestation }}
        run: |
          if [[ "$STATIC_QUALITY" != "success" ]]; then
            echo "::error::Static quality finished with result: $STATIC_QUALITY"
            exit 1
          fi
          if [[ "$TESTS" != "success" ]]; then
            echo "::error::One or more Bun test shards finished with result: $TESTS"
            exit 1
          fi
          if [[ "$ATTESTATION_REQUIRED" == "true" && "$ATTESTATION" != "success" ]]; then
            echo "::error::The required exact-SHA attestation finished with result: $ATTESTATION"
            exit 1
          fi
          if [[ "$ATTESTATION_REQUIRED" != "true" && "$ATTESTATION" != "skipped" ]]; then
            echo "::error::The unselected attestation finished with unexpected result: $ATTESTATION"
            exit 1
          fi
