name: Security attestation

# HEAD-bound security attestation artifact (spec 011).
#
# Produces `security-attestation.json` for every push to `main`. Release tags
# emit the same SHA-bound artifact inside release.yml's blocking preflight, so
# publication cannot race ahead of this record.
#
# The job fails only on a check that was performed and FAILED. Checks that
# cannot be performed on the runner (no pinned veraPDF binary yet) are recorded
# as `null`/`indeterminate` and do not turn the job red — a permanently red
# job is one nobody reads.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-attestation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  attest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          # attest.ts diffs scripts/verapdf/baseline.json against HEAD~1 to
          # report how the baseline moved in this commit; a depth-1 clone has
          # no parent and would silently degrade that field to null.
          fetch-depth: 2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Emit security attestation
        run: bun scripts/security/attest.ts --out security-attestation.json

      - name: Upload attestation
        # Uploaded even on failure: a FAILED check is exactly the artifact a
        # reviewer needs to look at.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-attestation-${{ github.sha }}
          path: security-attestation.json
          if-no-files-found: error
