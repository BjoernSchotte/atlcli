name: Action Palette NVDA Evidence

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - ".github/workflows/action-palette-nvda.yml"
      - "apps/extension/tests/palette/screenreader/nvda-windows.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  nvda-chrome:
    name: NVDA + Chrome/Windows evidence
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22.12.0"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the production MV3 extension
        run: bun run --cwd apps/extension build

      - name: Verify Google Chrome Stable
        shell: pwsh
        run: |
          $chrome = Join-Path $env:ProgramFiles "Google\Chrome\Application\chrome.exe"
          if (-not (Test-Path $chrome)) { throw "Google Chrome Stable is not installed." }
          & $chrome --version

      - name: Run NVDA against the headed production extension
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          $version = "2026.1.1"
          $expectedSha256 = "6e0289eb5a3aa076eb97ea99c5d5465cb48b5ecc6a3257dc3d811f881a1747c9"
          $installer = Join-Path $env:RUNNER_TEMP "nvda_$version.exe"
          $portable = Join-Path $env:RUNNER_TEMP "nvda-portable"
          $nvdaLog = Join-Path $env:RUNNER_TEMP "nvda-input-output.log"
          $evidence = Join-Path $env:RUNNER_TEMP "action-palette-nvda-evidence"
          Invoke-WebRequest "https://download.nvaccess.org/releases/$version/nvda_$version.exe" -OutFile $installer
          $actualSha256 = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "NVDA installer checksum mismatch: $actualSha256"
          }
          $create = Start-Process -Wait -PassThru -FilePath $installer -ArgumentList @(
            "--create-portable-silent",
            "--portable-path=$portable"
          )
          if ($create.ExitCode -ne 0) { throw "NVDA portable creation failed with exit code $($create.ExitCode)." }
          $nvda = Join-Path $portable "nvda.exe"
          Start-Process -FilePath $nvda -ArgumentList @(
            "--minimal",
            "--lang=en",
            "--log-level=12",
            "--log-file=$nvdaLog"
          )
          Start-Sleep -Seconds 5
          $running = Start-Process -Wait -PassThru -FilePath $nvda -ArgumentList "--check-running"
          if ($running.ExitCode -ne 0) { throw "NVDA did not remain running." }
          $env:ATLCLI_NVDA_EVIDENCE_DIR = $evidence
          $env:ATLCLI_NVDA_LOG_PATH = $nvdaLog
          $env:ATLCLI_NVDA_VERSION = $version
          $env:ATLCLI_NVDA_INSTALLER_SHA256 = $actualSha256
          $env:ATLCLI_BROWSER_CHANNEL = "chrome"
          $env:ATLCLI_SOURCE_SHA = "${{ github.event.pull_request.head.sha || github.sha }}"
          try {
            & node apps/extension/tests/palette/screenreader/nvda-windows.mjs
            if ($LASTEXITCODE -ne 0) { throw "NVDA screen-reader assertions failed." }
          } finally {
            Start-Process -Wait -FilePath $nvda -ArgumentList "--quit"
            Remove-Item -Force -ErrorAction SilentlyContinue $nvdaLog
          }

      - name: Upload redacted NVDA evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: action-palette-nvda-${{ github.run_id }}
          path: ${{ runner.temp }}/action-palette-nvda-evidence
          if-no-files-found: warn
          retention-days: 14
