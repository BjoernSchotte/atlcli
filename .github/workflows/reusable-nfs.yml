name: NFS transport proof

on:
  workflow_call:

permissions:
  contents: read

jobs:
  native:
    name: Native NFS / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.92.0 --profile minimal --component rustfmt --component clippy
      - name: Install Linux mount client
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y nfs-common
      - name: Install workspace dependencies
        run: bash scripts/ci/install-frozen-dependencies.sh
      - name: Build and test locked helper
        run: |
          cargo +1.92.0 fmt --manifest-path packages/confluence-nfs/Cargo.toml --check
          cargo +1.92.0 clippy --locked --manifest-path packages/confluence-nfs/Cargo.toml --all-targets -- -D warnings
          cargo +1.92.0 test --locked --manifest-path packages/confluence-nfs/Cargo.toml
          cargo +1.92.0 build --locked --manifest-path packages/confluence-nfs/Cargo.toml
      - name: Test bridge and native read-only mounts with synthetic data
        env:
          ATLCLI_NFS_KERNEL: "1"
          ATLCLI_NFS_LIVE: "0"
        run: |
          export ATLCLI_NFS_TEST_HELPER="$PWD/packages/confluence-nfs/target/debug/atlcli-confluence-nfs"
          bun run test apps/cli/src/vfs/nfs-framing.test.ts apps/cli/src/vfs/nfs-filesystem.test.ts apps/cli/src/vfs/nfs-bridge.test.ts apps/cli/src/vfs/nfs-bridge-failures.test.ts apps/cli/src/vfs/nfs-journal.test.ts apps/cli/src/vfs/mount-transport.test.ts
