name: TMP TUI Windows proof

# Temporary (feat/tui): runs the release-style cross-compiled Windows CLI on Windows. Removed after the proof.
on:
  push:
    branches: [feat/tui]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bash scripts/ci/install-frozen-dependencies.sh
      - run: bun install --frozen-lockfile --os='*' --cpu='*'
      - run: bun run fonts:ensure
      - run: bun scripts/release-artifacts.ts build --channel dev --dry-run --target windows-x64 --skip-extension --output out
      - uses: actions/upload-artifact@v7
        with:
          name: atlcli-windows-x64
          path: out/atlcli-windows-x64.zip
          if-no-files-found: error
          retention-days: 1

  smoke-windows:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: atlcli-windows-x64
          path: release
      - name: Version and TUI self-test
        shell: pwsh
        env:
          ATLCLI_DISABLE_UPDATE_CHECK: "1"
        run: |
          Expand-Archive -LiteralPath release/atlcli-windows-x64.zip -DestinationPath cli
          & .\cli\atlcli.exe --version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & .\cli\atlcli.exe tui --self-test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
