sonar.projectKey=atlcli
sonar.projectName=atlcli

# gesamtes Repo scannen, Noise ausschließen
sonar.sources=.
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/.turbo/**,**/.astro/**,**/coverage/**

# Test-Dateien als Tests markieren (nicht ausschließen)
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/test_*.py,**/*_test.py

sonar.sourceEncoding=UTF-8

# Coverage (aus: bun test --coverage --coverage-reporter=lcov)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
