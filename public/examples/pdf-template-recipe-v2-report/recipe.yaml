schema: wiki.pdf-template-recipe/v2

# A compact report: no cover or closing page but a title block on page 1, the
# title in the running head of the following pages, "page x of y" in the
# footer, and a calm teal palette. Built on the editorial baseline version 2
# (Catalog V4), which adds the page toggles and the title block.
template:
  id: atlcli.report
  name: Report
  version: 1.0.0

baseline:
  id: atlcli.editorial
  version: 2
  catalogVersion: 4
  digest: 0265a7ae9b996cd85cfb1f87c393e928a7e874d6b8d9eeecb674233bedbc458a

design:
  page:
    margin:
      mode: physical
      top: 24mm
      bottom: 20mm
      left: 20mm
      right: 20mm

  compositions:
    cover:
      enabled: false
    closingPage:
      enabled: false
    titleBlock:
      enabled: true
    running:
      header:
        enabled: true
        layout: split
        first: hide
        odd:
          start: { field: documentTitle }
          end: { field: spaceName }
        even:
          start: { field: documentTitle }
          end: { field: spaceName }
      footer:
        enabled: true
        layout: split
        first:
          start: { field: exportDate }
          end: { field: pageNumber, numbering: current-of-total }
        odd:
          start: { field: exportDate }
          end: { field: pageNumber, numbering: current-of-total }
        even:
          start: { field: exportDate }
          end: { field: pageNumber, numbering: current-of-total }

  navigation:
    contents:
      enabled: true
      depth: 2
      pageNumbers: show
      leader: dots

  components:
    table: { repeatHeader: true, banding: rows, borders: horizontal }
    callout: { preset: filled, icon: show }
    outline: { leader: dots, pageNumbers: show }

  branding:
    accent: "#0F6E74"

  typography:
    fonts:
      body: Source Sans 3
      heading: Source Sans 3
    roles:
      body: { font: body, size: 10pt }
      h1: { font: heading, size: 19pt, weight: bold }
      h2: { font: heading, size: 13.5pt, weight: semibold }
      h3: { font: heading, size: 11pt, weight: semibold }
      # The title block reuses the cover roles.
      coverTitle: { font: heading, size: 24pt, weight: bold }
      coverEyebrow: { font: heading, size: 7.5pt, weight: semibold, tracking: 0.12em }
      runningHead: { font: heading, size: 7.5pt }

  tokens:
    colors:
      accent: "#0F6E74"
      ink: "#1E2A36"
      heading3: "#24414B"
      mention: "#0F6E74"
      taskChecked: "#0F6E74"
      hairline: "#D9E2E4"
      tableStroke: "#D9E2E4"
      tableHeaderBackground: "#EEF4F5"
      codeBackground: "#F3F6F7"
      smartCardInlineBackground: "#E2F0F1"
    # The title block reuses the cover spacing; tighten it for page 1.
    layout:
      coverTitleLeading: 0.4em
      coverEyebrowGap: 8pt
      coverTitleGap: 12pt
      coverRuleLength: 36mm
      coverMetaGap: 8pt

  # A thin accent band across the top of the first page.
  paints:
    band:
      kind: solid
      color: accent

  decorations:
    - kind: rect
      scope: first
      layer: page-background
      box: { x: 0mm, y: 0mm, width: 210mm, height: 4mm }
      fill: band

assets: {}
